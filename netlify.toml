[build]
  base = "edupuntos---tareas-y-calificaciones"
  command = "bun install --frozen-lockfile && npm run build:netlify"
  publish = "dist/netlify"

[build.environment]
  NODE_VERSION = "24.19.0"
  BUN_VERSION = "1.4.2"

# Existing assets are served as files. Unknown asset requests must not receive SPA HTML.
[[redirects]]
  from = "/docentes/assets/*"
  to = "/404.html"
  status = 404
[[redirects]]
  from = "/alumnos/assets/*"
  to = "/404.html"
  status = 404
[[redirects]]
  from = "/docentes/*"
  to = "/docentes/index.html"
  status = 200
[[redirects]]
  from = "/alumnos/*"
  to = "/alumnos/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
